<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alpha VPN - Signal</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background: #05070f; color: #e2e8f0; margin: 0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 24px 32px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 1.5rem; }
    nav a { color: #93c5fd; margin-right: 16px; text-decoration: none; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }
    #signal-wrap { position: relative; width: min(70vh, 600px); height: min(70vh, 600px); display: flex; align-items: center; justify-content: center; }
    .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(0, 240, 255, 0.25); }
    .ring.pulse { animation: pulse 3s ease-out infinite; }
    .ring:nth-child(2) { animation-delay: 1s; }
    .ring:nth-child(3) { animation-delay: 2s; }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1); opacity: 0; }
    }
    #core { position: relative; z-index: 2; width: 60%; height: 60%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 40% 35%, #164e63, #05070f 75%); border: 3px solid #00f0ff; box-shadow: 0 0 40px rgba(0, 240, 255, 0.45); text-align: center; }
    #core .label { font-size: 1.75rem; letter-spacing: 0.35em; color: #00f0ff; font-weight: 700; }
    #core .strength { font-size: 3.5rem; font-weight: 800; margin-top: 8px; }
    #core .status { margin-top: 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.2em; }
    .status-ok { color: #4ade80; }
    .status-warn { color: #facc15; }
  </style>
</head>
<body>
  <header>
    <h1>Alpha VPN — Signal Identifier</h1>
    <nav>
      <a href="/activity.html">Activity</a>
      <a href="/license.html">License</a>
      <a href="/monitor.html">Monitor</a>
    </nav>
  </header>
  <main>
    <div id="signal-wrap">
      <div class="ring pulse" style="width: 100%; height: 100%;"></div>
      <div class="ring pulse" style="width: 100%; height: 100%;"></div>
      <div class="ring pulse" style="width: 100%; height: 100%;"></div>
      <div id="core">
        <div class="label">ALPHA</div>
        <div class="strength" id="strength">--%</div>
        <div class="status" id="status">Loading…</div>
      </div>
    </div>
  </main>
  <script>
    function render(signal) {
      document.getElementById('strength').textContent = signal.strength + '%';
      const statusEl = document.getElementById('status');
      statusEl.textContent = signal.status;
      statusEl.className = 'status ' + (signal.status === 'ok' ? 'status-ok' : 'status-warn');
    }

    async function loadSignal() {
      try {
        const res = await fetch('/api/signal');
        if (!res.ok) return;
        render(await res.json());
      } catch (e) {
        // API not available yet; core keeps its last known reading
      }
    }

    loadSignal();
    setInterval(loadSignal, 5000);
  </script>
</body>
</html>
